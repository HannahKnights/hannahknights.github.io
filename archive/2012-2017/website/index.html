</head>
<body>

        <div id="mask"></div>

        <img src="./static/images/page-4-V2.png" class="workLayout" data="./3.html">
        <img src="./static/images/page-2-V3.png" class="workLayout" data="./1.html">
        <img src="./static/images/page-1-V3.png" class="workLayout" data="./2.html">
        <img src="./static/images/page-3-V3.png" class="workLayout" data="./4.html">

        <table>
          <tr id="top">
            <td class="left">
              <div class="shutLinks">
                <a class="shut" >close</a> / 
                <a class="shut" data="all">clear all</a>
              </div>
            </td>
            <td class="center">
              <a class="open" data="./1.html">click for work</a>
            </td>
            <td class="right"></td>
          </tr>
          <tr id="middle">
            <td class="left">
              <a class="open" data="./2.html">&amp; more</a>
            </td>
            <td class="center"></td>
            <td class="right">
              <a class="open" data="./4.html">&amp; more</a>
            </td>
          </tr>
          <tr id="bottom">
            <td class="left"></td>
            <td class="center">
              <a class="open" data="./3.html">click for more work</a>
            </td>
            <td class="right"></td>
          </tr>
        </table>

        <table id="title">
          <tr id="main">
            <td class="center">
              Hannah Knights<br>
              <a href="cv/" class="info">( info )</a>
            </td>
          </tr>
        </table>


    <script src="../code.jquery.com/jquery-3.1.0.min.js"></script>
    <script>


      function hover() {
        $('a.info').addClass('hover')
      }

      function unhover() {
        $('a.info').removeClass('hover')
      }

      function openLink() {
        window.open( $('a.info').attr('href') , '_self')
      }

      function openWorkLayout() {
        var imgNum = $(this).attr('data')
        var workLayout = $('img[data="' + imgNum + '"]')
        if (workLayout) {
          var openImg = $('img:visible')
          var zIndex = 2
          if (openImg) {
            openImg.each( function() {
              if ( $(this).css('z-index') >= zIndex ) {
                zIndex = zIndex + 1
              }
            })
          }
          $('div.shutLinks').show()
          workLayout.css('z-index', zIndex)
          workLayout.show()
          $('table a.shut').first().attr('data', imgNum)
        }
      }

      function closeWorkLayout() {
        if ( $(this).attr('data') == 'all' ) {
          closeAll()
        }
        else {
          var img = $(this).attr('data')
          $('img[data="' + img +'"]').hide()
          updateLinkData()
          if ( ! $('img:visible').length ) {
            $('div.shutLinks').hide()
          }
        }
      }

      function closeAll() {
        $('img').hide()
        $('div.shutLinks').hide()
      }

      function updateLinkData() {
        var imgNum = ''
        var closeImgLink = $('table a.shut').first()
        var openImg = $('img:visible')
        if (openImg.length > 1) {
          counter = 0
          openImg.each( function() {
            zIndex = 0
            currentZ = $(this).css('z-index')
            if (currentZ > zIndex) {
              zIndex = currentZ
              imgNum = $(this).attr('data')
            }
          })
        }
        else {
          var imgNum = openImg.first().attr('data')
        }
        closeImgLink.attr( 'data', imgNum )
      }

      $(document).ready( function() {

        var mask = $('#mask')
        var workLink = $('table a.open')
        var closeLink = $('table a.shut')

        mask.mouseenter( hover )

        mask.mouseleave( unhover )

        mask.click( openLink )

        workLink.click( openWorkLayout )

        closeLink.click( closeWorkLayout )



      })

    </script>
  </body>
